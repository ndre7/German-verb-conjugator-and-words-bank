name: Build Android (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  APP_VERSION: "1.0.0"
  APP_ID: "com.ndredev.germanlearning"
  APP_NAME: "German learning"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (manual, no interactive)
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Accept licenses by writing hash files BEFORE running sdkmanager
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-preview-license
          echo "e6acf54c5b34a97b1b04a4ff9e7f887e3b2f4a6a" > $ANDROID_HOME/licenses/android-googletv-license
          echo "4d25795cbba0cb3376d587bd09008c6e" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license

          # Install required SDK components non-interactively
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" 2>&1 | grep -v "^\[" | head -50

          echo "ANDROID_HOME is set to $ANDROID_HOME"
          echo "SDK components installed"
          ls -la $ANDROID_HOME/

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-cap-

      - name: Install project dependencies
        run: bun install

      - name: Build frontend (Vite)
        run: bunx vite build

      - name: Create vite shim
        shell: bash
        run: |
          mkdir -p ci-shims
          cat > ci-shims/vite.js <<'EOF'
          module.exports = {
            createServer: async () => ({
              middlewares: function viteDisabledMiddleware(req, res, next) { next(); },
              httpServer: null,
              transformIndexHtml: async (_url, html) => html,
              ssrLoadModule: async () => { throw new Error("SSR is disabled in the packaged Android build"); },
            }),
          };
          EOF

      - name: Bundle AI proxy server (esbuild - standalone CJS)
        shell: bash
        run: |
          mkdir -p stage
          bunx esbuild server.ts --bundle --platform=node --format=cjs --alias:vite=./ci-shims/vite.js --external:@modelcontextprotocol/sdk --outfile=stage/server.cjs

      - name: Install Capacitor CLI and core
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          if ! grep -q "android.permission.INTERNET" $MANIFEST; then
            sed -i 's|</application>|<uses-permission android:name="android.permission.INTERNET" /></application>|' $MANIFEST
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p android/output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/output/German-learning-app-${APP_VERSION}-debug.apk

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: German-learning-app-Android-${{ env.APP_VERSION }}
          path: android/output/*.apk
          if-no-files-found: error
