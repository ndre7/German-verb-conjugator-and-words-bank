name: Build Windows (Tauri)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x64 (MSI / EXE)
    runs-on: windows-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://remix-german-verb-conjugation-manager-5955.ai.studio' }}
      VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || '' }}
      VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 || '' }}
      VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if (-not $?) {
            Write-Host "npm ci failed. Falling back to npm install..."
            npm install --no-audit --no-fund
          }

      - name: Type-check (fail fast)
        shell: pwsh
        run: npm run lint

      - name: Ensure Tauri config exists (auto-init if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Host "src-tauri/tauri.conf.json not found. Initializing Tauri scaffold..."
            npx --yes @tauri-apps/cli@^2 init --ci `
              --app-name "german-verb-app" `
              --window-title "German Verb Conjugator and Words Bank" `
              --frontend-dist "../dist" `
              --dev-url "http://localhost:3000" `
              --before-dev-command " " `
              --before-build-command "npm run build"

            $confPath = "src-tauri/tauri.conf.json"
            if (Test-Path $confPath) {
              $confJson = Get-Content $confPath -Raw
              if ($confJson -match '"identifier"\s*:\s*"com\.tauri\.dev"') {
                $confJson = $confJson -replace '"identifier"\s*:\s*"com\.tauri\.dev"', '"identifier": "com.ndre7.germanverbapp"'
                Set-Content -Path $confPath -Value $confJson -Encoding utf8
                Write-Host "Patched Tauri bundle identifier."
              }
              Write-Host "src-tauri/tauri.conf.json created successfully."
            } else {
              Write-Error "tauri init did not create src-tauri/tauri.conf.json"
              exit 1
            }
          } else {
            Write-Host "src-tauri/tauri.conf.json found."
          }

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows app (Tauri)
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.tauri) {
            npm run tauri -- build
          } else {
            npx --yes @tauri-apps/cli@^2 build
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: german-app-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
