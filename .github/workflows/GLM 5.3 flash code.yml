name: Build Windows Desktop (Electron)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-el332-eb2518

      - name: Install project dependencies
        run: bun install

      - name: Build frontend (Vite)
        run: bunx vite build

      - name: Create vite dev-server shim
        shell: bash
        run: |
          mkdir -p ci-shims
          cat > ci-shims/vite.js <<'EOF'
          module.exports = {
            createServer: async () => {
              throw new Error("vite dev server is disabled in the packaged desktop build");
            },
          };
          EOF

      - name: Bundle AI proxy server (esbuild -> standalone CJS)
        shell: bash
        run: |
          mkdir -p stage
          bunx esbuild server.ts --bundle --platform=node --format=cjs --alias:vite=./ci-shims/vite.js --external:@modelcontextprotocol/sdk --outfile=stage/server.cjs

      - name: Assemble Electron app (main process + manifest)
        shell: bash
        run: |
          mkdir -p stage/dist
          cp -r dist/. stage/dist/
          cp dist/index.html stage/index.html
          if [ -d dist/assets ]; then cp -r dist/assets stage/assets; fi
          cat > stage/main.js <<'EOF'
          const { app, BrowserWindow } = require("electron");
          const http = require("http");
          const fs = require("fs");
          const path = require("path");

          const API_PORT = Number(process.env.DESKTOP_API_PORT) || 41000 + Math.floor(Math.random() * 15000);
          const WEB_PORT = Number(process.env.DESKTOP_WEB_PORT) || 61000 + Math.floor(Math.random() * 15000);
          const API_HOST = "127.0.0.1";

          process.env.NODE_ENV = "production";
          process.env.PORT = String(API_PORT);

          try {
            require("./server.cjs");
            console.log("[desktop] AI proxy server started on port " + API_PORT);
          } catch (err) {
            console.error("[desktop] AI proxy server failed to start:", err);
          }

          process.on("uncaughtException", (err) => {
            console.error("[desktop] uncaughtException:", err);
          });

          const MIME = {
            ".html": "text/html; charset=utf-8",
            ".js": "text/javascript",
            ".mjs": "text/javascript",
            ".css": "text/css",
            ".json": "application/json",
            ".svg": "image/svg+xml",
            ".png": "image/png",
            ".jpg": "image/jpeg",
            ".jpeg": "image/jpeg",
            ".gif": "image/gif",
            ".webp": "image/webp",
            ".ico": "image/x-icon",
            ".woff": "font/woff",
            ".woff2": "font/woff2",
            ".ttf": "font/ttf",
          };

          function proxyToApi(req, res) {
            const upstream = http.request(
              {
                host: API_HOST,
                port: API_PORT,
                path: req.url,
                method: req.method,
                headers: Object.assign({}, req.headers, { host: API_HOST + ":" + API_PORT }),
              },
              (up) => {
                res.writeHead(up.statusCode || 502, up.headers);
                up.pipe(res);
              }
            );
            upstream.on("error", (err) => {
              if (!res.headersSent) {
                res.writeHead(502, { "Content-Type": "application/json" });
              }
              res.end(JSON.stringify({ success: false, error: "AI server unreachable: " + err.message }));
            });
            req.pipe(upstream);
          }

          function serveStatic(req, res) {
            let pathname = "/index.html";
            try {
              pathname = decodeURIComponent(new URL(req.url, "http://localhost").pathname);
            } catch (e) {}
            if (pathname === "/") pathname = "/index.html";

            const root = __dirname;
            const filePath = path.normalize(path.join(root, pathname));
            if (!filePath.startsWith(root)) {
              res.writeHead(403);
              return res.end("Forbidden");
            }

            fs.readFile(filePath, (err, data) => {
              if (err) {
                if (path.extname(pathname)) {
                  res.writeHead(404, { "Content-Type": "text/plain" });
                  return res.end("Not found");
                }
                fs.readFile(path.join(root, "index.html"), (err2, indexData) => {
                  if (err2) {
                    res.writeHead(404, { "Content-Type": "text/plain" });
                    return res.end("Not found");
                  }
                  res.writeHead(200, { "Content-Type": MIME[".html"] });
                  res.end(indexData);
                });
                return;
              }
              const ext = path.extname(filePath).toLowerCase();
              res.writeHead(200, { "Content-Type": MIME[ext] || "application/octet-stream" });
              res.end(data);
            });
          }

          http
            .createServer((req, res) => {
              if (req.url && req.url.indexOf("/api/") === 0) return proxyToApi(req, res);
              return serveStatic(req, res);
            })
            .listen(WEB_PORT, API_HOST);

          function waitForApi(attempt) {
            return new Promise((resolve) => {
              const req = http.get({ host: API_HOST, port: API_PORT, path: "/", timeout: 1500 }, (res) => {
                res.resume();
                resolve(true);
              });
              req.on("error", () => resolve(false));
              req.on("timeout", () => {
                req.destroy();
                resolve(false);
              });
            }).then((ok) => {
              if (ok) return true;
              if (attempt >= 40) return false;
              return new Promise((r) => setTimeout(r, 300)).then(() => waitForApi(attempt + 1));
            });
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 860,
              minWidth: 940,
              minHeight: 600,
              webPreferences: { contextIsolation: true, nodeIntegration: false },
            });
            win.loadURL("http://" + API_HOST + ":" + WEB_PORT + "/");
          }

          app.whenReady().then(async () => {
            await waitForApi(0);
            createWindow();
            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on("window-all-closed", () => {
            app.quit();
          });
          EOF
          cat > stage/package.json <<'EOF'
          {
            "name": "german-verb-manager",
            "version": "1.0.0",
            "description": "German Verb Conjugator & Words Bank - Windows Desktop",
            "author": "ndre7",
            "main": "main.js",
            "build": {
              "appId": "com.ndre7.germanverbmanager",
              "productName": "German Verb Manager",
              "directories": { "output": "release" },
              "files": ["main.js", "server.cjs", "dist/**", "index.html", "assets/**"],
              "win": { "target": ["nsis", "portable"] },
              "nsis": { "oneClick": false, "allowToChangeInstallationDirectory": true, "createDesktopShortcut": true }
            }
          }
          EOF

      - name: Install Electron tooling
        working-directory: stage
        run: npm install --no-fund --no-audit electron@33.2.0 electron-builder@25.1.8 --save-dev

      - name: Package Windows executables (Installer + Portable)
        working-directory: stage
        run: npx electron-builder --win nsis portable

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: German-Verb-Manager-Windows
          path: stage/release/*.exe
          if-no-files-found: error
