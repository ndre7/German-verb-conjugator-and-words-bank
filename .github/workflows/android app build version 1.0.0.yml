name: Build Android (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  APP_VERSION: "1.0.0"
  APP_ID: "com.ndredev.germanlearning"
  APP_NAME: "German learning"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (manual, no interactive)
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-preview-license
          echo "e6acf54c5b34a97b1b04a4ff9e7f887e3b2f4a6a" > $ANDROID_HOME/licenses/android-googletv-license
          echo "4d25795cbba0cb3376d587bd09008c6e" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license

          # Install required SDK components using the preinstalled cmdline-tools
          # (preinstalled at /usr/local/lib/android/sdk/cmdline-tools/latest)
          SDKMAN=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          if [ -f "$SDKMAN" ]; then
            echo "Using preinstalled sdkmanager"
            yes | $SDKMAN --licenses > /dev/null 2>&1 || true
            $SDKMAN --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, installing cmdline-tools"
            # Download and install cmdline-tools manually
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d $ANDROID_HOME/cmdline-tools/
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

          echo "✅ Android SDK setup complete"
          ls -la $ANDROID_HOME/licenses/
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms yet"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools yet"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-cap-

      - name: Install project dependencies
        run: bun install

      - name: Build frontend (Vite)
        run: bunx vite build

      - name: Install Capacitor CLI and core
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          if ! grep -q "android.permission.INTERNET" $MANIFEST; then
            sed -i 's|</application>|<uses-permission android:name="android.permission.INTERNET" /></application>|' $MANIFEST
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Android Release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build Android Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign Release APK (debug keystore)
        shell: bash
        run: |
          KEYSTORE=$HOME/.android/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore $KEYSTORE -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android \
            --out android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p android/output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/output/German-learning-app-${APP_VERSION}-debug.apk
          cp android/app/build/outputs/apk/release/app-release-signed.apk \
             android/output/German-learning-app-${APP_VERSION}-release.apk
          cp android/app/build/outputs/bundle/release/app-release-signed.aab \
             android/output/German-learning-app-${APP_VERSION}-release.aab

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: German-learning-app-Android-${{ env.APP_VERSION }}
          path: |
            android/output/*.apk
            android/output/*.aab
          if-no-files-found: error
