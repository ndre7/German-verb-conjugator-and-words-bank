name: Build Android (Capacitor + NodeJS-Mobile)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  APP_VERSION: "1.0.0"
  APP_ID: "com.ndredev.germanlearning"
  APP_NAME: "German learning"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses (license files + sdkmanager fallback)
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export SDKMAN=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "=== Android SDK license acceptance ==="
          echo "sdkmanager path: $SDKMAN"
          ls -la $SDKMAN || echo "sdkmanager not found at expected path"

          mkdir -p $ANDROID_HOME/licenses

          # Write standard license hash files
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-preview-license
          echo "e6acf54c5b34a97b1b04a4ff9e7f887e3b2f4a6a" > $ANDROID_HOME/licenses/android-googletv-license
          echo "4d25795cbba0cb3376d587bd09008c6e" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license

          echo "License files written:"
          ls -la $ANDROID_HOME/licenses/

          # Also run sdkmanager --licenses with yes pipe as fallback
          # (for cases where some newer licenses aren't covered by the hash files)
          if [ -f "$SDKMAN" ]; then
            echo "Running sdkmanager --licenses with auto-accept..."
            yes | $SDKMAN --licenses > /dev/null 2>&1 || true
            echo "sdkmanager --licenses done"
          fi

          echo "✅ Android SDK licenses accepted"
          echo "======================================"

      - name: Verify Android SDK setup
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/
          echo "---"
          echo "License files:"
          ls -la $ANDROID_HOME/licenses/
          echo "---"
          echo "cmdline-tools:"
          ls -la $ANDROID_HOME/cmdline-tools/
          echo "---"
          # Verify gradle will find the SDK
          echo "ANDROID_HOME is set: $(printenv ANDROID_HOME)"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-cap-

      - name: Install project dependencies
        run: bun install

      - name: Build frontend (Vite)
        run: bunx vite build

      - name: Create vite shim
        shell: bash
        run: |
          mkdir -p ci-shims
          cat > ci-shims/vite.js <<'EOF'
          module.exports = {
            createServer: async () => ({
              middlewares: function viteDisabledMiddleware(req, res, next) { next(); },
              httpServer: null,
              transformIndexHtml: async (_url, html) => html,
              ssrLoadModule: async () => { throw new Error("SSR is disabled in the packaged Android build"); },
            }),
          };
          EOF

      - name: Bundle AI proxy server (esbuild - standalone CJS)
        shell: bash
        run: |
          mkdir -p stage
          bunx esbuild server.ts --bundle --platform=node --format=cjs --alias:vite=./ci-shims/vite.js --external:@modelcontextprotocol/sdk --outfile=stage/server.cjs

      - name: Install Capacitor CLI and core
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/nodejs-mobile@6

      - name: Initialize Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            },
            "plugins": {
              "NodeJS": {
                "nodeDir": "nodejs-project"
              }
            }
          }
          EOF

      - name: Prepare NodeJS project for mobile
        shell: bash
        run: |
          mkdir -p nodejs-project
          cp stage/server.cjs nodejs-project/server.cjs
          cat > nodejs-project/package.json <<EOF
          {
            "name": "german-app-server",
            "version": "1.0.0",
            "main": "server.cjs",
            "dependencies": {
              "undici": "6.21.1"
            }
          }
          EOF
          cd nodejs-project
          npm install --omit=dev --no-fund --no-audit

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy server.cjs into Android assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/nodejs-project
          cp -r nodejs-project/. android/app/src/main/assets/nodejs-project/

      - name: Configure Android manifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          if ! grep -q "android.permission.INTERNET" $MANIFEST; then
            sed -i 's|</application>|<uses-permission android:name="android.permission.INTERNET" /></application>|' $MANIFEST
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Android Release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build Android Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign Release APK (debug keystore)
        shell: bash
        run: |
          KEYSTORE=$HOME/.android/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore $KEYSTORE -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android \
            --out android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p android/output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/output/German-learning-app-${APP_VERSION}-debug.apk
          cp android/app/build/outputs/apk/release/app-release-signed.apk \
             android/output/German-learning-app-${APP_VERSION}-release.apk
          cp android/app/build/outputs/bundle/release/app-release-signed.aab \
             android/output/German-learning-app-${APP_VERSION}-release.aab

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: German-learning-app-Android-${{ env.APP_VERSION }}
          path: |
            android/output/*.apk
            android/output/*.aab
          if-no-files-found: error
