name: Build Windows (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # برای درخواستهای سمت سرور (اگر سرور sidecar دارید)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # آدرس بکاند مستقر (نسخه وب AI Studio) — اگر Secret تنظیم نشده باشد از همین پیشفرض استفاده میشود
      # The packaged .exe has no local server, so the app first tries this URL for AI calls.
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://remix-german-verb-conjugation-manager-5955.ai.studio' }}
      # اگر بخواهید کلید مستقیم داخل کلاینت برود (اختیاری — امنیت کمتر)
      # Enables the in-app direct Gemini fallback (VITE_GEMINI_API_KEY, optionally VITE_GEMINI_API_KEY_2, _3, ...).
      # Required for AI to work inside the .exe when the backend above is unreachable.
      VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || '' }}
      VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 || '' }}
      VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Tauri config exists (auto-init if missing)
        # The repo does not commit src-tauri/, so scaffold it automatically instead
        # of failing. If src-tauri/ already exists, this step does nothing.
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Host "src-tauri/tauri.conf.json not found. Initializing Tauri scaffold..."
            npx --yes @tauri-apps/cli@^2 init --ci --app-name "german-verb-app" --window-title "German Verb Conjugator and Words Bank" --frontend-dist "../dist" --dev-url "http://localhost:3000" --before-dev-command "" --before-build-command "npm run build"
            $confPath = "src-tauri/tauri.conf.json"
            $confJson = Get-Content $confPath -Raw
            if ($confJson -match '"identifier"\s*:\s*"com\.tauri\.dev"') {
              $confJson = $confJson -replace '"identifier"\s*:\s*"com\.tauri\.dev"', '"identifier": "com.ndre7.germanverbapp"'
              Set-Content -Path $confPath -Value $confJson -Encoding utf8
              Write-Host "Patched Tauri bundle identifier to com.ndre7.germanverbapp."
            }
          } else {
            Write-Host "src-tauri/tauri.conf.json found."
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
