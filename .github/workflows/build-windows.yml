name: Build Windows (Tauri)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (MSI / EXE)
    runs-on: windows-latest

    env:
      # برای درخواست‌های سمت سرور (اگر سرور sidecar دارید)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # آدرس بک‌اند مستقر (نسخه وب AI Studio) — اگر Secret تنظیم نشده باشد از همین پیش‌فرض استفاده می‌شود
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://remix-german-verb-conjugation-manager-5955.ai.studio' }}
      # اگر بخواهید کلید مستقیم داخل کلاینت برود (اختیاری — امنیت کمتر)
      VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Verify Tauri config exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Error "src-tauri/tauri.conf.json not found. Run 'npx @tauri-apps/cli@^2 init' first."
            exit 1
          }

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebView2 و MSVC Build Tools روی windows-latest از قبل نصب هستند.
      - name: Build Windows app (Tauri)
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.tauri) {
            npm run tauri -- build
          } else {
            npx --yes @tauri-apps/cli@^2 build
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: german-app-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
